<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta http-equiv="x-ua-compatible" content="IE=edge">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Redirecting to the official portfolio of Syed Ahmed Mohi Uddin Hasan, Full-Stack Developer. This legacy page preserves SEO continuity while securely forwarding visitors to the new Vercel-hosted portfolio.">
<meta name="robots" content="index,follow">
<meta name="theme-color" content="#09090b">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="strict-origin-when-cross-origin">

<title>Redirecting • Syed Ahmed Mohi Uddin Hasan</title>

<link rel="canonical" href="https://syedahmed.vercel.app/">
<link rel="dns-prefetch" href="//syedahmed.vercel.app">
<link rel="preconnect" href="https://syedahmed.vercel.app" crossorigin>

<meta http-equiv="refresh" content="3;url=https://syedahmed.vercel.app/">

<style>
:root{
    color-scheme:dark;

    --bg:#09090b;
    --surface:rgba(18,18,20,.72);
    --border:#2a2a2d;

    --text:#fafafa;
    --muted:#d4d4d8;
    --subtle:#a1a1aa;

    --accent:#60a5fa;
    --accent-soft:rgba(96,165,250,.18);

    --radius:1.2rem;
    --shadow:0 24px 60px rgba(0,0,0,.45);

    --space:clamp(1.25rem,3vw,2.5rem);
    --gap:clamp(1rem,2vw,1.5rem);

    --container:min(92vw,38rem);
}

*,
*::before,
*::after{
    box-sizing:border-box;
}

html{
    height:100%;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
}

body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:clamp(.9rem,3vw,2rem);

    overflow:hidden;

    background:
        radial-gradient(circle at top,#16213a 0%,transparent 42%),
        radial-gradient(circle at bottom,#10131b 0%,transparent 40%),
        var(--bg);

    color:var(--text);

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    line-height:1.6;

    text-rendering:optimizeLegibility;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
}

main{
    width:100%;
    max-width:var(--container);
}

.card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);

    padding:var(--space);

    text-align:center;

    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);

    box-shadow:var(--shadow);
}

.loader{
    inline-size:3rem;
    block-size:3rem;

    margin-inline:auto;
    margin-block-end:1.5rem;

    border:.22rem solid #242427;
    border-top-color:var(--accent);
    border-radius:50%;

    will-change:transform;

    animation:spin .72s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

section{
    display:grid;
    gap:.55rem;
}

h1{
    margin:0;
    font-size:clamp(1.45rem,2vw + 1rem,2rem);
    line-height:1.2;
    font-weight:700;
    letter-spacing:-.02em;
}

p{
    margin:0;
    color:var(--muted);
    font-size:clamp(.98rem,.4vw + .9rem,1.08rem);
}

a{
    display:inline-flex;
    align-self:center;
    justify-self:center;

    margin-top:.35rem;

    color:var(--accent);

    text-decoration:none;
    font-weight:600;

    overflow-wrap:anywhere;
}

a:focus-visible{
    outline:.18rem solid var(--accent);
    outline-offset:.25rem;
    border-radius:.3rem;
}

a::after{
    content:"";
    display:block;
    position:absolute;
}

.separator{
    margin-block:1.9rem;
    border:0;
    border-top:1px solid var(--border);
}

[lang="ar"]{
    direction:rtl;
    font-family:
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;
}

[lang="ar"] h1{
    font-weight:700;
}

footer{
    margin-top:1.8rem;

    color:var(--subtle);

    font-size:clamp(.82rem,.25vw + .78rem,.92rem);
}

@media (prefers-reduced-motion:reduce){

    .loader{
        animation:none;
    }

    *{
        scroll-behavior:auto;
    }

}

@supports not (min-height:100dvh){
    body{
        min-height:100vh;
    }
}
</style>
</head>

<body>

<main>
<article class="card" aria-labelledby="title-en">

<div class="loader" aria-hidden="true"></div>

<section lang="en" aria-label="English">
<h1 id="title-en">Moving to My New Portfolio</h1>
<p>You are being securely redirected to my latest professional portfolio.</p>
<a href="https://syedahmed.vercel.app/" rel="noopener">syedahmed.vercel.app</a>
</section>

<hr class="separator" aria-hidden="true">

<section lang="ar" dir="rtl" aria-label="العربية">
<h1>الانتقال إلى موقعي الجديد</h1>
<p>يتم الآن تحويلك إلى أحدث نسخة من ملفي المهني.</p>
<a href="https://syedahmed.vercel.app/" rel="noopener">syedahmed.vercel.app</a>
</section>

<footer>
Redirecting in a few seconds • سيتم تحويلك خلال بضع ثوانٍ
</footer>

</article>
</main>

<script>
(() => {
    "use strict";
    const target = "https://syedahmed.vercel.app/";
    setTimeout(() => {
        if (location.href !== target) {
            location.replace(target);
        }
    }, 3000);
})();
</script>

</body>
</html>
